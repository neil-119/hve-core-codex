name: Publish HVE Core Codex edge snapshot

on:
  workflow_dispatch:
    inputs:
      port_revision:
        description: Positive revision for this port of the upstream commit
        type: string
        default: "1"
        required: true

permissions:
  contents: read

concurrency:
  group: hve-core-edge-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build an edge snapshot
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.assets.outputs.tag }}
      upstream_sha: ${{ steps.assets.outputs.upstream_sha }}
      validation_run_url: ${{ steps.assets.outputs.validation_run_url }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the locked build environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.22
          uv sync --locked --all-groups

      - name: Require current main and a successful exact-commit validation run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_main" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            > "$RUNNER_TEMP/validate-runs.json"
          python .github/scripts/publish_edge_snapshot.py check-validation \
            --validation-runs-json "$RUNNER_TEMP/validate-runs.json" \
            --port-commit "$GITHUB_SHA"

      - name: Build the latest upstream main into RUNNER_TEMP
        run: bash scripts/build.sh --channel edge --output "$RUNNER_TEMP/dist"

      - name: Validate the external distribution
        run: uv run hve-codex validate --output "$RUNNER_TEMP/dist" --record

      - name: Smoke-install the generated distribution in a temporary project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hve-edge-install-smoke"
          uv run hve-codex install \
            --distribution "$RUNNER_TEMP/dist" \
            --target "$RUNNER_TEMP/hve-edge-install-smoke" \
            --no-plugin --no-hooks

      - name: Create deterministic archives and checksums
        run: |
          set -euo pipefail
          bash scripts/build.sh --archive-only --output "$RUNNER_TEMP/dist"
          test -s "$RUNNER_TEMP/dist.zip"
          test -s "$RUNNER_TEMP/dist.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum -c dist.zip.sha256 dist.tar.gz.sha256)

      - name: Build the installer wheel and its checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hve-edge-installer"
          uv build --wheel --project "$GITHUB_WORKSPACE" --out-dir "$RUNNER_TEMP/hve-edge-installer"
          for wheel in "$RUNNER_TEMP/hve-edge-installer/"*.whl; do
            test -f "$wheel"
            (cd "$RUNNER_TEMP/hve-edge-installer" && sha256sum "$(basename "$wheel")" > "$(basename "$wheel").sha256")
          done

      - name: Prepare and recheck release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT_REVISION: ${{ inputs.port_revision }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_main" = "$GITHUB_SHA"
          python .github/scripts/publish_edge_snapshot.py prepare-assets \
            --distribution "$RUNNER_TEMP/dist" \
            --wheel-dir "$RUNNER_TEMP/hve-edge-installer" \
            --asset-dir "$RUNNER_TEMP/hve-edge-assets" \
            --validation-runs-json "$RUNNER_TEMP/validate-runs.json" \
            --port-commit "$GITHUB_SHA" \
            --port-revision "$PORT_REVISION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Transfer checked assets to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hve-core-edge-snapshot
          path: ${{ runner.temp }}/hve-edge-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create the immutable prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact validated port commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download checked assets from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hve-core-edge-snapshot
          path: ${{ runner.temp }}/hve-edge-assets

      - name: Recheck provenance, checksums, branch head, and immutable names
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT_REVISION: ${{ inputs.port_revision }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_main" = "$GITHUB_SHA"
          python .github/scripts/publish_edge_snapshot.py verify-assets \
            --asset-dir "$RUNNER_TEMP/hve-edge-assets" \
            --port-commit "$GITHUB_SHA" \
            --port-revision "$PORT_REVISION" \
            --github-output "$GITHUB_OUTPUT"
          python .github/scripts/publish_edge_snapshot.py ensure-absent \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.build.outputs.tag }}"

      - name: Create the tag and prerelease without replacing existing objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_main" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/hve-edge-assets/release-notes.md" \
            "$RUNNER_TEMP/hve-edge-assets"/*
