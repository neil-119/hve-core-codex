name: Weekly HVE Core stable and edge publication
on:
  schedule:
  - cron: "0 9 * * 1"
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
concurrency:
  group: hve-core-weekly-sync
  cancel-in-progress: false
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, edge]
    uses: ./.github/workflows/automatic-release.yml
    with:
      channel: ${{ matrix.channel }}
    permissions:
      actions: read
      contents: write
      issues: write
