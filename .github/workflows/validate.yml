name: Validate HVE Core Codex

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main, prerelease, edge]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, prerelease, edge]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Unit and schema checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.22
          uv sync --locked --all-groups

      - name: Lint source and tests
        run: uv run ruff check src tests

      - name: Run deterministic tests
        run: uv run pytest -q

      - name: Set up Node for the Vally adapter
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked Vally adapter dependencies
        working-directory: vally-executor
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test the Vally adapter without model calls
        working-directory: vally-executor
        run: npm test

      - name: Audit locked dependencies
        shell: bash
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uv run pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"

  external-distribution-validation:
    name: Build and validate an external distribution without model calls
    needs: static-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python and locked tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.22
          uv sync --locked --all-groups

      - name: Build latest stable upstream outside the repository
        run: bash scripts/build.sh --output "$RUNNER_TEMP/dist" --channel stable

      - name: Validate external distribution and deterministic archive
        run: |
          uv run hve-codex validate --output "$RUNNER_TEMP/dist" --record
          bash scripts/build.sh --archive-only --output "$RUNNER_TEMP/dist"
          test -s "$RUNNER_TEMP/dist.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum -c dist.tar.gz.sha256)

  human-review-only-sync:
    name: Keep sync PRs manual until the trusted external evidence gate is available
    needs: [static-validation, external-distribution-validation]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'sync/upstream-') &&
      github.event.pull_request.user.type == 'Bot' &&
      needs.static-validation.result == 'success' &&
      needs.external-distribution-validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain the human review requirement
        run: |
          {
            echo "Automatic merge is disabled for source-only sync PRs while the trusted external baseline and reviewed runtime evidence are being established."
            echo "Review the source lock, external distribution archive, checksums, and CLI/Desktop acceptance evidence before merging. Publication remains blocked unless the strict release eligibility gate passes."
          } >> "$GITHUB_STEP_SUMMARY"
