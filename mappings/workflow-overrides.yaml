    body_file: overrides/installer.md
    metadata_overrides:
      compatibility: Requires Python 3.11+, hve-codex, and a supported Codex client. Plugin discovery and hooks depend on client support and explicit trust.
    rationale: Replace Copilot VSIX installation with managed Codex installation,
      preserving consent and seven phases
    review_note: Stable and earlier pinned main retain the same consent, method selection,
      validation, connector setup, rerun, and optional component/customization phases.
      The main revision adds Bash jq checks and updates the advertised agents;
      these Copilot installation mechanics are replaced by the Codex CLI prerequisites.
      Unknown future source hashes still block conversion. Partial component installation
      is not supplied by the full-mode managed installer.
      The reviewed plugin-first source adds existing-install detection, one-route
      guidance, and per-file cleanup approval. The Codex override preserves those
      safeguards through doctor, update/uninstall previews and explicit cleanup
      consent. Copilot team-default settings and native-copy routes are replaced
      by managed project/user scope; never write Copilot settings from this workflow.
