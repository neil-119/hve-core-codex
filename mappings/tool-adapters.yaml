version: 1
adapters:
  - {pattern: 'read*', classification: native, capability: filesystem-read, availability: available, instruction: 'Use Codex filesystem reads. For diagnostics run the repository diagnostic command; for editor selection ask the user for the selected text.'}
  - {pattern: 'search*', classification: shell, capability: filesystem-search, availability: emulated, instruction: 'Use rg for text and file search; use git diff for changes. Semantic search requires evidence-based exploration rather than invented matches.'}
  - {pattern: 'edit*', classification: native, capability: filesystem-write, availability: available, instruction: 'Use apply_patch or authorized filesystem edits within the sandbox.'}
  - {pattern: 'execute*', classification: shell, capability: shell-execution, availability: available, instruction: 'Use exec_command and write_stdin for command execution and polling. Stop only the process owned by this workflow.'}
  - {pattern: 'agent*', classification: native, capability: delegation, availability: available, instruction: 'Spawn a named custom agent; wait for its result and resume with a follow-up. Give independent tasks disjoint write ownership.'}
  - {pattern: 'web*', classification: native, capability: web-research, availability: requires-configuration, instruction: 'Use the available web research tool; if absent report the missing capability and ask for sources.'}
  - {pattern: 'github/*', classification: MCP, capability: github, availability: requires-configuration, server: github, scope: source-tool-scoped, instruction: 'Require an authenticated GitHub MCP tool with the original read/write scope. Obtain explicit authorization before remote mutation.'}
  - {pattern: 'ado/*', classification: MCP, capability: azure-devops, availability: requires-configuration, server: azure-devops, scope: source-tool-scoped, instruction: 'Require an authenticated Azure DevOps MCP server and matching tool scope. Do not substitute another platform or mutate without authorization.'}
  - {pattern: 'jira/*', classification: MCP, capability: jira, availability: requires-configuration, server: jira, scope: source-tool-scoped, instruction: 'Require authenticated Jira MCP capabilities and explicit mutation authorization.'}
  - {pattern: 'microsoft-docs/*', classification: MCP, capability: microsoft-docs, availability: requires-configuration, server: microsoft-docs, scope: read-only, instruction: 'Require the Microsoft Docs MCP server or explicitly authorized official-document web research.'}
  - {pattern: '*work-iq*', classification: MCP, capability: work-iq, availability: requires-configuration, server: work-iq, scope: source-tool-scoped, instruction: 'Require the user-configured Work IQ connector. Never invent organizational data.'}
  - {pattern: '*askQuestions*', classification: ask-user, capability: user-decisions, availability: emulated, instruction: 'Use the host question tool when available; otherwise present choices and invite free text in chat, then wait for the decision.'}
  - {pattern: 'vscode*', classification: host-ui-alternative, capability: editor-ui, availability: emulated, instruction: 'Use a host-neutral file or browser workflow where specified. Ask the user for unavailable editor-only state.'}
  - {pattern: 'read_file', classification: native, capability: filesystem-read, availability: available, instruction: 'Read the authorized file using Codex filesystem reads.'}
  - {pattern: '*_file', classification: native, capability: filesystem-access, availability: available, instruction: 'Use Codex read tools or apply_patch within the original read/write boundary.'}
  - {pattern: '*_search', classification: shell, capability: filesystem-search, availability: emulated, instruction: 'Use rg and repository exploration.'}
  - {pattern: 'list_dir', classification: shell, capability: filesystem-read, availability: emulated, instruction: 'List the selected directory using the native shell.'}
  - {pattern: 'runSubagent', classification: native, capability: delegation, availability: available, instruction: 'Spawn a named custom agent, wait for its result, then resume with a follow-up. Preserve parent approval gates and disjoint file ownership.'}
  - {pattern: 'mcp_microsoft_pla_browser_*', classification: MCP, capability: browser-automation, availability: requires-configuration, server: playwright, scope: browser-session, instruction: 'Require an explicitly configured Playwright-compatible browser MCP server. Map the requested browser action to the available tool by capability; if absent stop with setup guidance.'}
  - {pattern: 'workiq/*', classification: MCP, capability: work-iq, availability: requires-configuration, server: work-iq, scope: source-tool-scoped, instruction: 'Require authenticated Work IQ capabilities with the original scopes. Never invent organization data; missing access blocks the affected step.'}
  - {pattern: 'workiq/accept_eula', classification: ask-user, capability: work-iq-consent, availability: emulated, instruction: 'Present the applicable terms to the user and wait for explicit acceptance. Do not accept a EULA on the user behalf without authorization.'}
  - {pattern: 'mcp_workiq_*', classification: MCP, capability: work-iq, availability: requires-configuration, server: work-iq, scope: source-tool-scoped, instruction: 'Require the authenticated Work IQ connector. Respect user consent and do not disclose organization data beyond the approved scope.'}
  - {pattern: 'mcp_workiq_accept_eula', classification: ask-user, capability: work-iq-consent, availability: emulated, instruction: 'Ask the user to review and explicitly accept applicable terms; do not implicitly accept them.'}
  - {pattern: 'WorkIQ-Mail-MCP-Server/*', classification: MCP, capability: mail-drafts, availability: requires-configuration, server: work-iq-mail, scope: source-tool-scoped, instruction: 'Require the configured mail MCP connector. Draft creation is an external write requiring source-prescribed authorization; draft permission never grants permission to send a message.'}
  - {pattern: 'mcp_github_*', classification: MCP, capability: github, availability: requires-configuration, server: github, scope: source-tool-scoped, instruction: 'Require authenticated GitHub MCP capabilities with the original tool read/write boundary. Remote mutations require explicit authorization.'}
  - {pattern: 'mcp_bicep_*', classification: MCP, capability: azure-resource-schema, availability: requires-configuration, server: bicep, scope: read-only, instruction: 'Require the Bicep resource schema MCP server or ask for official schema evidence. This read-only capability must not grant Azure deployment permissions.'}
  - {pattern: 'mcp_ado_*', classification: MCP, capability: azure-devops, availability: requires-configuration, server: azure-devops, scope: source-tool-scoped, instruction: 'Require authenticated Azure DevOps MCP capabilities for the original operation. Preserve the source read/write boundary; remote mutation requires explicit authorization.'}
