name: codex-port-edge-edge-path-03
description: Original edge edge-path-03 workflow preserved with Vally's built-in graders.
type: capability
defaults:
  runs: 1
  timeout: 600s
  executor: copilot-sdk
  judge_reasoning_effort: medium
stimuli:
  - name: edge-edge-path-03-rai-plan
    turns:
      - Launch .github/agents/rai-planning/rai-planner.agent.md
      - Invoke .github/agents/rai-planning/rai-planner.agent.md for profile-preferences and follow .github/skills/project-planning/rai-planner/SKILL.md. Prepare a bounded plan under .copilot-tracking/rai-plans/profile-preferences/. Record unsupported risk claims as gaps; do not edit app code or contact external services.
    tags:
      category: codex-port-preservation
      channel: edge
      legacy_case: edge-path-03
      legacy_title: RAI planning records evidence and gaps in project scope
      prompt_only_checks:
        - scope
        - source-recovery
    rubric:
      - Uses current RAI contract and reports evidence gaps rather than inventing assurance.
      - State stays scoped and app source unchanged.
    graders:
      - type: prompt
        name: judge-edge-path-03
        config:
          threshold: 0.7
          evidence:
            - trajectory
            - diff
      - type: file-exists
        name: state
        config:
          path: .copilot-tracking/rai-plans/profile-preferences/**
      - type: diff-not-contains
        name: read-only
        config:
          pattern: (?m)^diff --git a/(?:src/profile_preferences\.py) b/
    agent_environment:
      skills:
        - ../../.github/skills/project-planning/rai-planner
      files:
        - src: ../../.github/agents/rai-planning/rai-planner.agent.md
          dest: .github/agents/rai-planning/rai-planner.agent.md
        - src: ../../.github/skills/project-planning/rai-planner/SKILL.md
          dest: .github/skills/project-planning/rai-planner/SKILL.md
        - src: ../../.github/instructions/rai-planning/rai-identity.instructions.md
          dest: .github/instructions/rai-planning/rai-identity.instructions.md
        - src: ../../.github/instructions/shared/planner-identity-base.instructions.md
          dest: .github/instructions/shared/planner-identity-base.instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/rai-planning/rai-license-posture.instructions.md
          dest: .github/instructions/rai-planning/rai-license-posture.instructions.md
        - src: ../../.github/agents/privacy/privacy-reviewer.agent.md
          dest: .github/agents/privacy/privacy-reviewer.agent.md
        - src: ../../.github/agents/accessibility/accessibility-reviewer.agent.md
          dest: .github/agents/accessibility/accessibility-reviewer.agent.md
        - src: fixtures/src/profile_preferences.py
          dest: src/profile_preferences.py
        - src: fixtures/docs/data-flow.md
          dest: docs/data-flow.md
